<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linhas Mira 8BP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: transparent;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Bolha Flutuante */
        .bolha {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: #0096ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            z-index: 99999;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.6);
            cursor: pointer;
            touch-action: none;
            user-select: none;
            transition: all 0.2s;
        }

        .bolha:active {
            transform: scale(0.9);
            background: #0077dd;
        }

        .bolha.ativo {
            box-shadow: 0 0 25px #00ffcc, 0 0 40px rgba(0, 255, 204, 0.4);
        }

        /* Painel de Controles */
        .painel {
            position: fixed;
            top: 190px;
            right: 20px;
            width: 240px;
            background: rgba(15, 15, 25, 0.95);
            border-radius: 14px;
            padding: 18px;
            color: white;
            z-index: 99998;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            display: none;
        }

        .painel.mostrar {
            display: block;
        }

        .painel h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #4ecdc7;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-verde { background: #2ecc71; color: white; }
        .btn-verde:active { background: #27ae60; }

        .btn-azul { background: #3498db; color: white; }
        .btn-azul:active { background: #2980b9; }

        .btn-vermelho { background: #e74c3c; color: white; }
        .btn-vermelho:active { background: #c0392b; }

        .controle-grupo {
            margin: 12px 0;
        }

        .controle-grupo label {
            font-size: 13px;
            color: #aaa;
            display: block;
            margin-bottom: 6px;
        }

        .controle-grupo input[type="range"] {
            width: 100%;
            height: 6px;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .dica {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Bolha Flutuante -->
    <div class="bolha" id="bolha">🎱</div>

    <!-- Painel de Controles -->
    <div class="painel" id="painel">
        <h3>🎱 Linhas Mira 8BP</h3>
        
        <div class="controle-grupo">
            <label>📏 Comprimento</label>
            <input type="range" id="comprimentoLinha" min="50" max="400" value="200">
        </div>

        <div class="controle-grupo">
            <label>➖ Espessura</label>
            <input type="range" id="espessuraLinha" min="1" max="6" value="3">
        </div>

        <button class="btn btn-verde" id="btnMostrar">✅ Mostrar Linhas</button>
        <button class="btn btn-azul" id="btnEsconder">👁‍🗨 Esconder Linhas</button>
        <button class="btn btn-vermelho" id="btnFechar">✖ Fechar Painel</button>
        
        <div class="dica">💡 Arraste para mover • Toque para abrir</div>
    </div>

    <canvas id="telaLinhas"></canvas>

    <script>
        // Elementos
        const bolha = document.getElementById('bolha');
        const painel = document.getElementById('painel');
        const telaLinhas = document.getElementById('telaLinhas');
        const ctx = telaLinhas.getContext('2d');
        
        const btnMostrar = document.getElementById('btnMostrar');
        const btnEsconder = document.getElementById('btnEsconder');
        const btnFechar = document.getElementById('btnFechar');
        const comprimentoLinha = document.getElementById('comprimentoLinha');
        const espessuraLinha = document.getElementById('espessuraLinha');

        // Variáveis
        let painelAberto = false;
        let linhasVisiveis = false;
        let pontoX = window.innerWidth / 2;
        let pontoY = window.innerHeight / 2;
        let angulo = 0;
        let comprimento = 200;
        let espessura = 3;
        
        // Variáveis para arrastar a bolha
        let arrastando = false;
        let offsetX, offsetY;
        let ultimoToque = 0;

        // Ajustar tamanho do canvas
        function ajustarCanvas() {
            telaLinhas.width = window.innerWidth;
            telaLinhas.height = window.innerHeight;
            desenharLinhas();
        }

        // Desenhar as linhas de mira
        function desenharLinhas() {
            ctx.clearRect(0, 0, telaLinhas.width, telaLinhas.height);
            
            if (!linhasVisiveis) return;

            // Linha principal
            ctx.beginPath();
            ctx.moveTo(pontoX, pontoY);
            ctx.lineTo(
                pontoX + Math.cos(angulo) * comprimento,
                pontoY + Math.sin(angulo) * comprimento
            );
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = espessura;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Linha de retorno
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(pontoX, pontoY);
            ctx.lineTo(
                pontoX - Math.cos(angulo) * (comprimento * 0.6),
                pontoY - Math.sin(angulo) * (comprimento * 0.6)
            );
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.4)';
            ctx.lineWidth = espessura * 0.7;
            ctx.stroke();
            ctx.setLineDash([]);

            // Ponto de origem
            ctx.beginPath();
            ctx.arc(pontoX, pontoY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffcc';
            ctx.fill();
        }

        // Abrir/Fechar Painel
        function alternarPainel(e) {
            const agora = Date.now();
            if (agora - ultimoToque < 300) return; // Evita duplo clique
            ultimoToque = agora;
            
            painelAberto = !painelAberto;
            
            if (painelAberto) {
                painel.classList.add('mostrar');
                bolha.classList.add('ativo');
            } else {
                painel.classList.remove('mostrar');
                bolha.classList.remove('ativo');
            }
        }

        // === ARRASTAR A BOLHA ===
        
        // Começar a arrastar (toque)
        bolha.addEventListener('touchstart', (e) => {
            arrastando = true;
            const toque = e.touches[0];
            const rect = bolha.getBoundingClientRect();
            offsetX = toque.clientX - rect.left - 35;
            offsetY = toque.clientY - rect.top - 35;
        });

        // Mover enquanto arrasta (toque)
        document.addEventListener('touchmove', (e) => {
            if (!arrastando) return;
            const toque = e.touches[0];
            bolha.style.left = (toque.clientX - offsetX) + 'px';
            bolha.style.top = (toque.clientY - offsetY) + 'px';
            bolha.style.right = 'auto'; // Reseta o right
            e.preventDefault();
        });

        // Soltar bolha
        document.addEventListener('touchend', () => {
            if (arrastando) {
                arrastando = false;
                // Se só tocou sem arrastar muito → abre o painel
                setTimeout(alternarPainel, 200);
            }
        });

        // Suporte para mouse também
        bolha.addEventListener('mousedown', (e) => {
            arrastando = true;
            const rect = bolha.getBoundingClientRect();
            offsetX = e.clientX - rect.left - 35;
            offsetY = e.clientY - rect.top - 35;
        });

        document.addEventListener('mousemove', (e) => {
            if (!arrastando) return;
            bolha.style.left = (e.clientX - offsetX) + 'px';
            bolha.style.top = (e.clientY - offsetY) + 'px';
            bolha.style.right = 'auto';
        });

        document.addEventListener('mouseup', () => {
            if (arrastando) {
                arrastando = false;
            }
        });

        // Botões
        btnMostrar.addEventListener('click', () => {
            linhasVisiveis = true;
            desenharLinhas();
        });

        btnEsconder.addEventListener('click', () => {
            linhasVisiveis = false;
            desenharLinhas();
        });

        btnFechar.addEventListener('click', () => {
            painelAberto = false;
            painel.classList.remove('mostrar');
            bolha.classList.remove('ativo');
        });

        comprimentoLinha.addEventListener('input', (e) => {
            comprimento = parseInt(e.target.value);
            desenharLinhas();
        });

        espessuraLinha.addEventListener('input', (e) => {
            espessura = parseInt(e.target.value);
            desenharLinhas();
        });

        // Inicializar
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();
    </script>
</body>
</html>
